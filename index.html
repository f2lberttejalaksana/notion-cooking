<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe</title>
<style>
:root{--cell:#fff;--fg:rgb(55,53,47);--mut:rgba(55,53,47,.65);--line:rgba(55,53,47,.16);--act:rgb(237,243,236);--auto:rgb(251,243,219);--sh:rgb(247,246,243)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fg:rgba(255,255,255,.81);--mut:rgba(255,255,255,.46);--cell:rgb(37,37,37);--line:rgba(255,255,255,.13);--act:rgb(36,61,48);--auto:rgb(89,74,42);--sh:rgb(37,37,37)}}
:root[data-theme=dark]{--fg:rgba(255,255,255,.81);--mut:rgba(255,255,255,.46);--cell:rgb(37,37,37);--line:rgba(255,255,255,.13);--act:rgb(36,61,48);--auto:rgb(89,74,42);--sh:rgb(37,37,37)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--fg);font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";-webkit-font-smoothing:antialiased}
body{padding:2px}
.wrap{overflow-x:auto;padding:1px}
.g{display:grid;gap:1px;min-width:max-content}
.c{background:var(--cell);padding:6px 12px;box-shadow:0 0 0 1px var(--line);border-radius:3px;display:flex;align-items:center}
.pre{grid-column:1/-1;justify-content:center;text-align:center}
.a{background:var(--act);justify-content:center;text-align:center;font-weight:500;min-width:110px;max-width:170px}
.auto{background:var(--auto)}
.notes{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mut)}
.notes li:before{content:"⚠ "}
#ed{margin-top:12px}
textarea{width:100%;height:200px;background:var(--sh);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
button{background:var(--sh);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;margin:6px 6px 0 0}
button:hover{background:var(--line)}
.hide{display:none}
</style></head><body>
<div class="wrap"><div class="g" id="g"></div></div>
<ul class="notes hide" id="n"></ul>
<div id="ed" class="hide"><textarea id="src" spellcheck="false"></textarea>
<div id="bt"><button id="go">Render</button><button id="cp">Copy embed link</button><span id="m"></span></div></div>
<script>
const SAMPLE=`title Espresso Brownies
pre Butter and flour an 8x8-in pan
pre Preheat oven to 350°F (170°C)
a: melt => melted butter | 4 oz (115 g) unsalted butter
b: mix => sweet base | @a | 1 cup (200 g) sugar | 1/4 tsp. (2.5 mL) vanilla extract | 1 shot (60 mL) fresh brewed espresso
c: mix => wet batter | @b | 2 large (100 g) eggs
d: fold in => brownie batter | @c | 1/2 cup (80 g) all-purpose flour | 1/3 cup (80 g) cocoa powder | 1/4 tsp. (1.3 g) baking soda | 1/4 tsp. (1.5 g) table salt
e: bake 350°F (170°C) 30 to 40 min => brownies | @d`;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parse(t){const R={title:'',pre:[],steps:[],notes:[]};
 for(let l of t.split('\n')){l=l.trim();if(!l)continue;let m;
  if(m=l.match(/^title\s+(.+)/i))R.title=m[1];
  else if(m=l.match(/^pre\s+(.+)/i))R.pre.push({t:m[1]});
  else if(m=l.match(/^(\w+):\s*([^|]*?)\s*(?:=>\s*([^|]*?))?\s*(?:\|(.*))?$/))
   R.steps.push({id:m[1],action:m[2].trim(),out:(m[3]||'').trim(),ins:(m[4]||'').split('|').map(s=>s.trim()).filter(Boolean),auto:[]});
  else R.notes.push('Could not parse: '+l)}
 return R}
function fix(R){const S=R.steps,by={};S.forEach(s=>by[s.id]=s);
 S.forEach((s,i)=>{
  if(!s.action){s.action='combine';s.auto.push('action')}
  s.ins=s.ins.filter(x=>{if(x[0]=='@'&&!by[x.slice(1)]){R.notes.push(`${s.id}: unknown reference ${x} dropped`);return false}return true});
  if(!s.ins.length&&i){s.ins=['@'+S[i-1].id];s.auto.push('input: previous step')}
  if(!s.out){s.out=s.action.split(' ')[0]+' result';s.auto.push('output name')}
  s.ins.forEach(x=>{if(x[0]!='@'){if(!/\d|pinch|dash|to taste/i.test(x))R.notes.push(`No quantity: "${x}"`);
   else if(/\b(oz|cups?|tsp|tbs|tbsp|lb)\b/i.test(x)&&!/\(\s*[\d.]+\s*(g|ml|mL|kg|l)\s*\)/.test(x))R.notes.push(`No metric weight/volume: "${x}"`)}})});
 if(!S.length)return R;
 const used=new Set();S.forEach(s=>s.ins.forEach(x=>x[0]=='@'&&used.add(x.slice(1))));
 const last=S[S.length-1];
 S.slice(0,-1).forEach(s=>{if(!used.has(s.id)){last.ins.unshift('@'+s.id);last.auto.push('joined unused "'+s.out+'"')}});
 const bk=S.map(s=>s.action.match(/(\d{3})\s*°?\s*F/i)).find(Boolean);
 if(bk&&!R.pre.some(p=>/preheat/i.test(p.t)))R.pre.unshift({t:`Preheat oven to ${bk[1]}°F (${Math.round((bk[1]-32)/9)*5}°C)`,auto:1});
 if(/bake|roast/i.test(last.action)&&!R.pre.some(p=>/pan|tray|dish|grease|butter and flour/i.test(p.t)))R.notes.push('No pan/tray prep step given');
 return R}
function name(x){return x.replace(/^[\d\/.\s]+(\([^)]*\)\s*)?(cups?|tsp\.?|tbs\.?|tbsp|oz|g|ml|shots?|large|lb)?\s*(\([^)]*\)\s*)?/i,'').trim()||x}
function draw(text){
 const R=fix(parse(text)),S=R.steps,by={};S.forEach(s=>by[s.id]=s);

 document.title=R.title||'Recipe';
 const leaves=[],seen=new Set();
 (function w(s){if(seen.has(s.id))return s.d||1;seen.add(s.id);let d=0,r0=leaves.length;
  s.ins.forEach(x=>{if(x[0]=='@')d=Math.max(d,w(by[x.slice(1)]));else leaves.push(x)});
  s.r0=r0;s.r1=Math.max(leaves.length,r0+1);s.d=d+1;return s.d})(S[S.length-1]||{ins:[],id:'-'});
 const P=R.pre.length;let h='';
 R.pre.forEach((p,i)=>h+=`<div class="c pre ${p.auto?'auto':''}" style="grid-row:${i+1}" ${p.auto?'title="Auto-added"':''}>${esc(p.t)}</div>`);
 leaves.forEach((x,i)=>h+=`<div class="c" style="grid-row:${P+i+1};grid-column:1">${esc(x)}</div>`);
 S.filter(s=>s.d).forEach(s=>{
  h+=`<div class="c a ${s.auto.length?'auto':''}" title="${esc('Makes: '+s.out+(s.auto.length?' · auto: '+s.auto.join('; '):''))}" style="grid-row:${P+s.r0+1}/${P+s.r1+1};grid-column:${s.d+1}">${esc(s.action)}</div>`});
 $('g').innerHTML=h;
 $('n').innerHTML=R.notes.map(n=>`<li>${esc(n)}</li>`).join('')}
const q=new URLSearchParams(location.search);
let src=q.get('r');
if(!src&&q.get('z'))try{src=decodeURIComponent(escape(atob(q.get('z').replace(/-/g,'+').replace(/_/g,'/'))))}catch(e){}
if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');
$('src').value=src||SAMPLE;
if(q.get('edit')=='1'){$('ed').classList.remove('hide');$('n').classList.remove('hide')}
if(q.get('embed')=='1')$('bt').classList.add('hide');
$('go').onclick=()=>draw($('src').value);
$('cp').onclick=async()=>{const u=location.origin+location.pathname+'?r='+encodeURIComponent($('src').value);
 try{await navigator.clipboard.writeText(u);$('m').textContent=' copied'}catch(e){prompt('Copy:',u)}};
draw($('src').value);
</script></body></html>
