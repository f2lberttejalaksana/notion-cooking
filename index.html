<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Engineer</title>
<style>
:root{--fg:#37352f;--mut:rgba(55,53,47,.65);--bd:rgba(55,53,47,.09);--bg2:#f7f6f3;--ac:#2383e2;--wait:rgba(35,131,226,.2);--crit:#d9730d;--crw:rgba(217,115,13,.22);--err:#e03e3e}
:root[data-theme=dark]{--fg:rgba(255,255,255,.81);--mut:rgba(255,255,255,.46);--bd:rgba(255,255,255,.094);--bg2:#252525;--ac:#529cca;--wait:rgba(82,156,202,.26);--crit:#ffa344;--crw:rgba(255,163,68,.26);--err:#ff7369}
*{box-sizing:border-box}
body{margin:0;padding:8px 12px 18px;background:transparent;color:var(--fg);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:28px;line-height:1.2;margin:2px 0 8px;font-weight:700}
h2{font-size:14px;font-weight:600;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.row,.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;padding:1px 8px;border-radius:4px;background:var(--bg2);color:var(--mut);font-size:12.5px;line-height:22px}
.chip b{color:var(--fg);font-weight:500}
.chip.save{color:#0f7b6c}[data-theme=dark] .chip.save{color:#4dab9a}
button{font:inherit;font-size:12.5px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:4px;padding:0 8px;line-height:22px;cursor:pointer}
button:hover{background:var(--bg2)}button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.st button{width:22px;padding:0;text-align:center;line-height:20px}
.sp{flex:1}
.gantt{position:relative;padding-top:20px}
.grid{position:absolute;left:150px;right:0;top:0;bottom:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;border-left:1px solid var(--bd);font:11px/16px inherit;color:var(--mut);font-style:normal;padding-left:3px}
.gr{display:flex;align-items:center;height:26px}
.lab{width:150px;flex:none;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.lab em{font-style:normal;color:var(--mut);margin-right:4px}
.tr{position:relative;flex:1;height:16px}
.bar{position:absolute;top:0;height:16px;border-radius:3px;background:var(--ac)}
.bar.w{background:repeating-linear-gradient(135deg,var(--wait) 0 4px,transparent 4px 8px);border:1px solid var(--wait);height:16px}
.crit .bar{background:var(--crit)}.crit .bar.w{background:repeating-linear-gradient(135deg,var(--crw) 0 4px,transparent 4px 8px);border-color:var(--crw)}
.leg{font-size:12px;color:var(--mut);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.leg s{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:4px;text-decoration:none}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.ing{display:flex;gap:8px;align-items:flex-start;padding:2px 0;cursor:pointer}
.ing input{margin:4px 0 0;accent-color:var(--ac)}
.ing input:checked+span{opacity:.45;text-decoration:line-through}
.ing b{font-weight:600}
ol.steps{margin:0;padding:0;list-style:none}
ol.steps li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd)}
.t{flex:none;width:46px;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.crit .t{color:var(--crit)}
.sm{color:var(--mut);font-size:12.5px;margin-left:4px}
.inf{border-bottom:1px dotted var(--mut);cursor:help}
.call{display:flex;gap:10px;padding:12px 14px;border-radius:4px;background:var(--bg2);margin-top:18px}
.call details{flex:1}summary{cursor:pointer}
.call ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.err{color:var(--err)}
textarea{width:100%;min-height:220px;margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:4px;background:var(--bg2);color:var(--fg);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.hide{display:none}
@media(max-width:480px){.lab,.grid{--w:100px}.lab{width:100px}.grid{left:100px}h1{font-size:24px}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const SAMPLE=`title: Weeknight ragù
servings: 4
cooks: 1
ingredients:
  - 500 g beef mince
  - 1 yellow onion
  - 2 carrots
  - 2 cloves garlic
  - 400 g canned tomatoes
  - 150 ml red wine
  - 300 g tagliatelle
  - 30 g parmesan
  - salt
steps:
  - Dice the onion and carrots
  - Mince the garlic
  - Brown the beef mince in a heavy pot
  - Sauté onion, carrots and garlic until soft
  - Add the wine and tomatoes, then simmer for 60 minutes
  - Boil salted water and cook the tagliatelle
  - Grate the parmesan
  - Toss pasta with the ragù and serve with parmesan
`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=location.hash.includes('=')?'&'+location.hash.slice(1):'';
const P=new URLSearchParams(location.search+H),EMBED=P.get('embed')=='1';
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));
const raw=u=>u.replace(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/,'https://raw.githubusercontent.com/$1/$2/$3').replace(/^(https:\/\/gist\.github\.com\/[^/]+\/[0-9a-f]+)\/?$/,'$1/raw');
const mq=matchMedia('(prefers-color-scheme:dark)'),setTh=()=>document.documentElement.dataset.theme=P.get('theme')||(mq.matches?'dark':'light');setTh();mq.onchange=setTh;

// ---------- heuristics ----------
const PREP=/\b(dice|chop|slice|mince the|peel|grate|zest|measure|weigh|cut|trim|wash|rinse|prep|crush|juice|julienne|gather)\b/i;
const PASSIVE=[[/\bpreheat/i,15],[/\b(marinat|proof|prove|chill|refrigerat|freez)\w*/i,30],[/\b(bake|roast)\b/i,30],[/\b(simmer|braise|stew|slow.?cook)\b/i,30],[/\b(boil|cook (the )?(pasta|rice|potato|noodle|tagliatelle|spaghetti))/i,12],[/\b(rest|cool|stand|soak)\b/i,10]];
const ACTIVE=[[/\b(dice|chop|slice|mince|peel|grate|zest|cut|trim|julienne)\b/i,6],[/\b(sauté|saute|fry|brown|sear|toast|caramel)\w*/i,8],[/\b(whisk|mix|stir|combine|fold|knead|toss|season|add)\b/i,3],[/\b(plate|serve|garnish)\b/i,3]];
const DUR=/(\d+(?:\.\d+)?)\s*(?:-|–|to)?\s*(\d+(?:\.\d+)?)?\s*(h(?:ours?|rs?)?|min(?:ute)?s?)\b/i;
const GEN=new Set(['salt','pepper','water','oil','sugar','butter']);
const keyOf=n=>{const k=String(n).split(',')[0].trim().split(/\s+/).pop().toLowerCase().replace(/[^a-z]/g,'').replace(/(es|s)$/,'');return k.length>2?k:''};
const num=s=>{s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return+m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
function parseIng(i){
  if(i&&typeof i=='object'){const n=i.name||i.n||'';return{q:i.qty??i.q??null,u:i.unit||i.u||'',n,note:i.note||'',key:keyOf(n)}}
  const m=String(i).match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(kg|g|ml|l|tsp|tbsp|cups?|oz|lb|pinch|cloves?|cans?|bunch|)\b\s*(.*)$/i);
  return m?{q:num(m[1]),u:m[2],n:m[3],key:keyOf(m[3])}:{q:null,u:'',n:String(i),key:keyOf(i)};
}
const fq=x=>{x=+x;return x>=100?Math.round(x):+x.toFixed(2)};

// ---------- optimiser ----------
function optimise(doc,cooks){
  const gaps=[],ings=(doc.ingredients||[]).map(parseIng);
  const steps=(doc.steps||[]).map((s,i)=>{if(typeof s=='string')s={do:s};return{...s,do:String(s.do||s.step||''),inf:[],deps:new Set()}});
  if(!doc.servings)gaps.push('Servings not set, assumed 4');
  let pre=null;
  const baker=steps.find(s=>/\b(bake|roast|broil)\b/i.test(s.do));
  if(baker&&!steps.some(s=>/preheat/i.test(s.do))){
    const t=baker.do.match(/(\d{3})\s*°?\s*([CF])\b/i);
    pre={do:'Preheat oven'+(t?` to ${t[1]}°${t[2].toUpperCase()}`:''),time:1,wait:15,auto:1,inf:['added'],deps:new Set()};steps.unshift(pre);
  }
  const by={};steps.forEach((s,i)=>{s.i=i;s.id=s.id||'s'+(i+1);by[s.id]=s;
    s.ing=ings.filter(g=>g.key&&new RegExp('\\b'+g.key+'(e?s)?\\b','i').test(s.do));
    let a=s.time,w=s.wait;
    if(a==null&&w==null){
      const m=s.do.match(DUR),d=m?Math.max(+m[1],+(m[2]||0))*(/^h/i.test(m[3])?60:1):null,pv=PASSIVE.find(([r])=>r.test(s.do));
      if(pv){w=d??pv[1];a=2}else{a=d??(ACTIVE.find(([r])=>r.test(s.do))||[0,5])[1];w=0}
      s.inf.push('duration');
    }
    s.a=+a||0;s.w=+w||0});
  steps.forEach((s,i)=>{
    if(s.after!=null){[].concat(s.after).forEach(a=>by[a]?s.deps.add(by[a]):gaps.push(`Unknown step id “${a}” in “${s.id}”`));return}
    const last={};
    for(let j=0;j<i;j++)for(const g of steps[j].ing)if(!GEN.has(g.key)&&s.ing.includes(g))last[g.key]=steps[j];
    Object.values(last).forEach(x=>s.deps.add(x));
    const prev=steps.slice(0,i).reverse().find(x=>!x.auto);
    const par=/\b(meanwhile|while|separately|at the same time)\b/i.test(s.do),then=/\b(then|once|when|combine|together|return|toss)\b/i.test(s.do);
    if(prev&&!par&&(then||(!s.deps.size&&!PREP.test(s.do))))s.deps.add(prev);
    if(s.deps.size)s.inf.push('dependency');
  });
  const lastS=steps[steps.length-1];
  if(lastS&&lastS.after==null&&/\b(serve|plate|finish)\b/i.test(lastS.do)){
    steps.forEach(x=>{if(x!==lastS&&!steps.some(y=>y!==lastS&&y.deps.has(x)))lastS.deps.add(x)});
    if(!lastS.inf.includes('dependency'))lastS.inf.push('dependency');
  }
  if(pre)steps.forEach(x=>{if(x!==pre&&/\b(bake|roast|broil)\b/i.test(x.do))x.deps.add(pre)});
  const dp=new Map(steps.map(s=>[s,[]]));steps.forEach(s=>s.deps.forEach(d=>dp.get(d).push(s)));
  const tail=new Map(),T=s=>{if(tail.has(s))return tail.get(s);tail.set(s,0);const v=s.a+s.w+Math.max(0,...dp.get(s).map(T));tail.set(s,v);return v};
  // critical path (no resource limit)
  const ef=new Map(),EF=s=>{if(ef.has(s))return ef.get(s);ef.set(s,0);const v=Math.max(0,...[...s.deps].map(EF))+s.a+s.w;ef.set(s,v);return v};
  const cp=Math.max(0,...steps.map(EF)),lf=new Map(),LF=s=>{if(lf.has(s))return lf.get(s);lf.set(s,cp);const v=Math.min(cp,...dp.get(s).map(d=>LF(d)-d.a-d.w));lf.set(s,v);return v};
  steps.forEach(s=>s.crit=LF(s)-EF(s)<.01);
  // schedule with limited cooks
  const free=Array(cooks).fill(0),done=new Set(),left=[...steps];
  while(left.length){
    const ready=left.filter(s=>[...s.deps].every(d=>done.has(d)));
    const p=(ready.length?ready:[left[0]]).sort((x,y)=>T(y)-T(x)||x.i-y.i)[0];
    const dr=Math.max(0,...[...p.deps].map(d=>d.end??0));
    let c=-1;if(p.a>0)c=free.indexOf(Math.min(...free));
    p.start=Math.max(dr,c>=0?free[c]:0);p.cook=c;if(c>=0)free[c]=p.start+p.a;
    p.end=p.start+p.a+p.w;done.add(p);left.splice(left.indexOf(p),1);
  }
  const total=Math.max(0,...steps.map(s=>s.end)),seq=steps.reduce((n,s)=>n+s.a+s.w,0),hands=steps.reduce((n,s)=>n+s.a,0);
  const sh=s=>s.do.length>46?s.do.slice(0,44)+'…':s.do;
  steps.forEach(s=>{
    if(s.inf.includes('added'))gaps.push(`Added “${s.do}” (${s.w}m wait) because a later step needs a hot oven`);
    if(s.inf.includes('duration'))gaps.push(`“${sh(s)}”: estimated ${s.a}m hands-on${s.w?` + ${s.w}m waiting`:''}`);
    if(s.inf.includes('dependency'))gaps.push(`“${sh(s)}”: runs after ${[...s.deps].map(d=>'“'+sh(d)+'”').join(', ')}`);
  });
  const unused=ings.filter(g=>!steps.some(s=>s.ing.includes(g))&&g.key);
  if(unused.length)gaps.push('Not mentioned in any step: '+unused.map(g=>g.n).join(', '));
  return{steps,ings,gaps,total,seq,hands};
}

// ---------- render ----------
const fm=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:m+'m'};
let doc,source,st={cooks:+P.get('cooks')||0,servings:+P.get('servings')||0},editing=false;
function render(){
  const app=$('#app');
  try{doc=jsyaml.load(source);if(!doc||typeof doc!='object')throw Error('Recipe must be a YAML mapping with title, ingredients and steps.')}
  catch(e){app.innerHTML=editor()+`<p class="err">${esc(e.message)}</p>`;wire();return}
  const cooks=st.cooks||doc.cooks||1,base=doc.servings||4,sv=st.servings||base,f=sv/base,M=optimise(doc,cooks);
  const tick=[5,10,15,30,60,120].find(s=>M.total/s<=8)||180,ticks=[];for(let t=0;t<=M.total;t+=tick)ticks.push(t);
  const pc=x=>(x/Math.max(M.total,1)*100)+'%',ord=[...M.steps].sort((a,b)=>a.start-b.start||a.i-b.i);
  const inf=(s,k,t)=>s.inf.includes(k)?`<span class="inf" title="Estimated">~${t}</span>`:t;
  app.innerHTML=`<h1>${esc(doc.title||'Untitled recipe')}</h1>
  <div class="meta">
   <span class="chip">Total <b>${fm(M.total)}</b></span>
   ${M.seq-M.total>1?`<span class="chip save">Saves <b>${fm(M.seq-M.total)}</b> vs. step by step</span>`:''}
   <span class="chip">Hands-on <b>${fm(M.hands)}</b></span>
   <span class="chip st">Serves <button data-s="-1" aria-label="Fewer servings">−</button><b>${sv}</b><button data-s="1" aria-label="More servings">+</button></span>
   <span class="chip st">Cooks <button data-c="-1" aria-label="Fewer cooks">−</button><b>${cooks}</b><button data-c="1" aria-label="More cooks">+</button></span>
   <span class="sp"></span>${EMBED?'':'<button id="ed">Edit</button><button id="cp">Copy embed link</button>'}</div>
  ${editor()}
  <h2>Timeline</h2>
  <div class="gantt"><div class="grid">${ticks.map(t=>`<i style="left:${pc(t)}">${fm(t)}</i>`).join('')}</div>
   ${ord.map(s=>`<div class="gr ${s.crit?'crit':''}" title="${esc(s.do)}"><div class="lab"><em>${s.i+1}</em>${esc(s.do)}</div><div class="tr">
    ${s.a?`<div class="bar" style="left:${pc(s.start)};width:max(${pc(s.a)},3px)"></div>`:''}
    ${s.w?`<div class="bar w" style="left:${pc(s.start+s.a)};width:${pc(s.w)}"></div>`:''}</div></div>`).join('')}</div>
  <div class="leg"><span><s style="background:var(--ac)"></s>Hands-on</span><span><s style="background:var(--wait)"></s>Waiting</span><span><s style="background:var(--crit)"></s>Critical path</span></div>
  <h2>Ingredients</h2>
  <div class="ings">${M.ings.map(g=>`<label class="ing"><input type="checkbox"><span>${g.q!=null?`<b>${fq(g.q*f)}${g.u?' '+esc(g.u):''}</b> `:''}${esc(g.n)}${g.note?`, ${esc(g.note)}`:''}</span></label>`).join('')}</div>
  <h2>Method</h2>
  <ol class="steps">${ord.map(s=>`<li class="${s.crit?'crit':''}"><span class="t">${fm(s.start)}</span><div>${esc(s.do)}<span class="sm">${s.a?inf(s,'duration',fm(s.a))+' active':''}${s.a&&s.w?' · ':''}${s.w?inf(s,'duration',fm(s.w))+' wait':''}${cooks>1&&s.cook>=0?' · cook '+'ABCDEF'[s.cook]:''}</span></div></li>`).join('')}</ol>
  ${M.gaps.length?`<div class="call"><span>💡</span><details><summary>Filled ${M.gaps.length} gap${M.gaps.length>1?'s':''} in the recipe</summary><ul>${M.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></details></div>`:''}`;
  wire();
}
function editor(){return `<textarea id="src" spellcheck="false" aria-label="Recipe YAML" class="${editing?'':'hide'}">${esc(source)}</textarea>`}
function wire(){
  const q=s=>document.querySelectorAll(s);
  q('[data-s]').forEach(b=>b.onclick=()=>{st.servings=Math.max(1,(st.servings||doc.servings||4)+ +b.dataset.s);render()});
  q('[data-c]').forEach(b=>b.onclick=()=>{st.cooks=Math.min(6,Math.max(1,(st.cooks||doc.cooks||1)+ +b.dataset.c));render()});
  const ed=$('#ed'),cp=$('#cp'),ta=$('#src');
  if(ed)ed.onclick=()=>{editing=!editing;ta.classList.toggle('hide',!editing)};
  if(cp)cp.onclick=()=>{const u=location.origin+location.pathname+'?embed=1&y='+enc(source);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>cp.textContent='Copied',()=>prompt('Copy this link',u))};
  if(ta){let t;ta.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{source=ta.value;const pos=ta.selectionStart;render();const n=$('#src');n.focus();n.setSelectionRange(pos,pos)},400)}}
}
(async()=>{
  try{
    if(P.get('y'))source=dec(P.get('y'));
    else if(P.get('src')){const r=await fetch(raw(P.get('src')));if(!r.ok)throw Error('HTTP '+r.status);source=await r.text()}
  }catch(e){$('#app').innerHTML=`<p class="err">Could not load the recipe: ${esc(e.message)}. Check the link is public and points to a YAML file.</p>`;return}
  source=source||SAMPLE;if(!P.get('y')&&!P.get('src'))editing=!EMBED;render();
})();
</script></body></html>
