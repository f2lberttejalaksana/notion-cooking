<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The Original Tiramisu</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="sheet">

  <header class="head" id="head">
    <h1 id="recipe-title">The Original Tiramisu</h1>
    <p class="serves" id="recipe-serves">Serves 12</p>
  </header>

  <p class="prep" id="prep" hidden></p>

  <div class="chart-frame" id="frame" tabindex="-1">
    <table class="chart" id="chart"></table>
  </div>
  <p class="scroll-hint" id="scroll-hint" hidden>Scroll for later steps <span aria-hidden="true">→</span></p>

  <section class="steps" id="steps" aria-labelledby="steps-title">
    <h2 id="steps-title">Steps in order</h2>
    <ol class="steps-list" id="steps-list" role="list"></ol>
  </section>

  <div class="notes" id="notes" hidden></div>

  <section class="editor" id="editor" hidden aria-labelledby="editor-title">
    <h2 id="editor-title">Recipe source</h2>
    <p class="editor-help">
      One step per line: <code>id: action =&gt; output | ingredient | @step</code>.
      Add <code>title</code>, <code>serves</code>, and <code>pre</code> lines for the rest.
    </p>
    <label class="sr-only" for="source">Recipe source</label>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" id="render" type="button">Render chart</button>
      <button class="btn" id="copy" type="button">Copy embed link</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
